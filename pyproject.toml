[project]
name = "kanoya"
version = "0.1.0"
description = "奈良春日 鹿のや レベニュー・インテリジェンス"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kanoya = "kanoya.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kanoya"]

[tool.pytest.ini_options]
testpaths = ["tests"]

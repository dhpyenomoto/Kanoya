[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanoya"
version = "1.0.0"
description = "奈良春日 鹿のや レベニュー・インテリジェンス"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kanoya = "kanoya.cli:main"

[tool.setuptools.packages.find]
include = ["kanoya*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

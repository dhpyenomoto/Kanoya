name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Render the dashboard from demo data
        run: |
          python -m kanoya demo --as-of 2026-08-15
          python -m kanoya render --as-of 2026-08-15 -o dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dist/index.html
